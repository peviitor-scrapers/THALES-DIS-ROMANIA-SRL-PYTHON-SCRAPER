name: Automation Tests

on:
  schedule:
    - cron: '0 7 * * *'
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run mode (no deletions)'
        required: true
        default: 'true'

jobs:
  validate-jobs:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    needs: Automation-Tests

    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      - name: Validate and remove expired jobs
        run: |
          if [ "${{ github.event_name }}" == "schedule" ]; then
            echo "Schedule trigger — running LIVE mode..."
            python3 -m scraper.validate_jobs --mode content --delete
          elif [ "${{ github.event.inputs.dry_run }}" == "true" ]; then
            echo "Running in DRY RUN mode..."
            python3 -m scraper.validate_jobs --mode content --dry-run
          else
            echo "Running in LIVE mode (will delete expired jobs)..."
            python3 -m scraper.validate_jobs --mode content --delete
          fi

  ensure-company-core:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Ensure company exists in company core
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          CIF=$(jq -r '.id' scraper/config/company.json)
          LEGAL_NAME=$(jq -r '.company' scraper/config/company.json)
          BRAND=$(jq -r '.brand' scraper/config/company.json)
          WEBSITE=$(jq -r '.website[0]' scraper/config/company.json)
          CAREER=$(jq -r '.career[0]' scraper/config/company.json)
          DEFAULT_LOC=$(jq -r '.location[0]' scraper/config/company.json)
          SCRAPER_FILE=$(jq -r '.scraperFile' scraper/config/company.json)

          jq -n \
            --arg id "$CIF" \
            --arg company "$LEGAL_NAME" \
            --arg brand "$BRAND" \
            --arg website "$WEBSITE" \
            --arg career "$CAREER" \
            --arg loc "$DEFAULT_LOC" \
            --arg today "$TODAY" \
            --arg scraperFile "$SCRAPER_FILE" \
            '{id:$id,company:$company,brand:$brand,status:"activ",location:[$loc],website:[$website],career:[$career],lastScraped:$today,scraperFile:$scraperFile}' \
            > company_data.json

          echo "Upserting ${BRAND} (CIF: ${CIF}) via peviitor API..."
          curl -s -X PUT \
            "https://api.peviitor.ro/v1/firme/company/add/" \
            -H "Content-Type: application/json" \
            --data-binary @company_data.json

          FINAL=$(curl -s \
            "https://api.peviitor.ro/v1/firme/company/?cif=${CIF}" | jq '.total')

          echo "${BRAND} count after upsert: $FINAL"

          if [ "$FINAL" -ge "1" ]; then
            echo "SUCCESS: ${BRAND} is in company core"
          else
            echo "FAILED: ${BRAND} still not in company core"
            exit 1
          fi

  Automation-Tests:
    runs-on: ubuntu-latest
    needs: ensure-company-core
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sync with remote
        if: github.event_name != 'pull_request'
        run: git pull origin main --rebase -X theirs

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      - name: Run Unit Tests
        run: |
          mkdir -p docs/test-results
          python3 -m pytest tests/unit tests/consistency \
            --html=docs/test-results/pre-scrape-unit.html --self-contained-html || true

      - name: Upload Unit Test Results
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: docs/test-results/pre-scrape-unit.html
          retention-days: 30

      - name: Run Integration Tests
        run: |
          mkdir -p docs/test-results
          python3 -m pytest tests/integration \
            --html=docs/test-results/pre-scrape-integration.html --self-contained-html || true

      - name: Upload Integration Test Results
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-results
          path: docs/test-results/pre-scrape-integration.html
          retention-days: 30

      - name: Run E2E Tests
        run: |
          mkdir -p docs/test-results
          python3 -m pytest tests/e2e \
            --html=docs/test-results/post-scrape.html --self-contained-html || true

      - name: Upload E2E Test Results
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-results
          path: docs/test-results/post-scrape.html
          retention-days: 30

      - name: Push test results to docs/
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/test-results/
          git commit -m "[skip ci] Update test results" || echo "No changes to commit"
          git push || echo "Push failed (race condition) — will be picked up next run"
